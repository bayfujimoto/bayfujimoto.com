<html lang="en">
<head>

<title>Film calendar ribbon — live preview</title>

<style>
  /* Tokens mirrored from the site's dark theme (tokens.css) */
  :root{
    --grid-line:rgba(232,224,208,.12);
    --overlay-text:#e8e0d0;
    --overlay-muted:rgba(232,224,208,.5);
    --font-mono:'Commit Mono',ui-monospace,Menlo,Consolas,monospace;
    --font-serif:'EB Garamond',Georgia,serif;
    --text-xs:0.8rem;
    --tracking-wide:0.07em;
    --tracking-wider:0.1em;
    --leading-base:1.5;
    --dur-base:0.15s;
    --item-grid-cell-height:160px;
  }
  html,body{margin:0;background:#000;color:var(--overlay-text);font-family:var(--font-serif);height:100%}
  .preview-note{position:fixed;top:0;left:0;right:0;z-index:10;padding:.7rem 1rem;
    background:rgba(0,0,0,.8);border-bottom:1px solid var(--grid-line);
    font-family:var(--font-mono);font-size:.7rem;letter-spacing:.04em;color:var(--overlay-muted)}
  .preview-note b{color:var(--overlay-text);font-weight:400}

  /* ── Base item-grid (mirrored from main.css) ── */
  .item-grid-wrap{position:fixed;top:50%;left:0;right:0;transform:translateY(-50%);
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(232,224,208,.25) transparent}
  .item-grid-wrap::-webkit-scrollbar{height:10px}
  .item-grid-wrap::-webkit-scrollbar-thumb{background:rgba(232,224,208,.25);border-radius:5px}
  .item-grid{display:flex;width:max-content;flex-direction:row;align-items:flex-start;padding:1rem 2rem 1rem 4rem}
  .item-grid__group{display:flex;flex-direction:column;align-items:flex-start}
  .item-grid__group:first-child .item-grid__cell--first-col{border-left:1px solid var(--grid-line)}
  .item-grid__cells{display:grid;grid-auto-flow:column;grid-auto-columns:var(--item-grid-cell-height)}
  .item-grid__cell{border-top:1px solid var(--grid-line);border-left:1px solid var(--grid-line);
    width:var(--item-grid-cell-height);height:var(--item-grid-cell-height);display:flex;align-items:center;justify-content:center}
  .item-grid__cell--first-col{border-left:none}
  .item-grid__btn{background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;font-family:inherit;color:var(--overlay-muted);transition:color var(--dur-base)}
  .item-grid__btn:hover{color:var(--overlay-text)}
  /* Films */
  .item-grid--films{--film-cell-height:calc(var(--item-grid-cell-height) * 3 / 4)}
  .item-grid--films .item-grid__cells{grid-auto-columns:calc(var(--film-cell-height) * 16 / 9)}
  .item-grid--films .item-grid__cell{width:calc(var(--film-cell-height) * 16 / 9);height:var(--film-cell-height)}
  .item-grid--films .item-grid__btn{position:relative;overflow:hidden}
  .item-grid__thumb--backdrop{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
  .item-grid__noimg{display:flex;align-items:center;justify-content:center;width:100%;height:100%;
    font-size:var(--text-xs);letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--overlay-muted);
    background:repeating-linear-gradient(-45deg,transparent 0 11px,rgba(232,224,208,.05) 11px 12px)}
  .item-grid__title{position:absolute;left:0;right:0;bottom:0;padding:.45rem .55rem;text-align:left;
    font-size:var(--text-xs);line-height:var(--leading-base);color:var(--overlay-text);
    background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,0));opacity:0;transform:translateY(.3rem);
    transition:opacity var(--dur-base),transform var(--dur-base);pointer-events:none}
  .item-grid--films .item-grid__btn:hover .item-grid__title,
  .item-grid--films .item-grid__btn:focus-visible .item-grid__title{opacity:1;transform:translateY(0)}
  @media (hover:none){.item-grid__title{opacity:1;transform:none}}

  /* ── Film calendar ribbon (mirrored verbatim from main.css) ── */
  .item-grid__cells--film-cal{border-bottom:1px solid var(--grid-line);border-right:1px solid var(--grid-line)}
  .item-grid__month{grid-row:1;align-self:end;font-family:var(--font-mono);font-size:var(--text-xs);
    letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--overlay-muted);white-space:nowrap;
    padding:0 .4rem .35rem;pointer-events:none}
  .item-grid__cell--day{position:relative}
  .item-grid__cell--empty{align-items:flex-start;justify-content:flex-end}
  .item-grid__daynum{font-family:var(--font-mono);font-size:.65rem;line-height:1;letter-spacing:.02em;
    color:rgba(232,224,208,.32);padding:.32rem .36rem;user-select:none}
  .item-grid__daynum--over{position:absolute;top:0;right:0;z-index:2;color:rgba(255,255,255,.92);pointer-events:none}
  .item-grid__gap{grid-row:2 / 6;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.3rem;text-align:center;padding:0 .6rem;border-top:1px solid var(--grid-line);
    border-left:1px dashed var(--grid-line);border-right:1px dashed var(--grid-line)}
  .item-grid__gap-label{font-family:var(--font-mono);font-size:.6rem;letter-spacing:var(--tracking-wide);
    text-transform:uppercase;color:var(--overlay-muted)}
  .item-grid__gap-years{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--overlay-text)}
</style>
</head>

const el = (tag, cls="") => { const e=document.createElement(tag); if(cls)e.className=cls; return e; };

function buildFilmCell(f, dom, showNum){
  const cell = el("div","item-grid__cell item-grid__cell--day item-grid__cell--watched");
  const btn = el("button","item-grid__btn"); btn.type="button"; btn.setAttribute("aria-label",f.t);
  if (f.bd){ const img=el("img","item-grid__thumb item-grid__thumb--backdrop"); img.src=f.bd; img.alt=""; img.loading="lazy"; btn.appendChild(img); }
  else { const ph=el("span","item-grid__noimg"); ph.textContent="no reproduction"; btn.appendChild(ph); }
  const title=el("span","item-grid__title"); title.textContent=f.t; btn.appendChild(title);
  if (showNum){ const num=el("span","item-grid__daynum item-grid__daynum--over"); num.textContent=dom; btn.appendChild(num); }
  cell.appendChild(btn); return cell;
}

function buildFilmRibbon(gridEl, items){
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const withDate=items.filter(i=>i.wd).slice().sort((a,b)=> a.wd.localeCompare(b.wd) || (a.t||"").localeCompare(b.t||""));
  if(!withDate.length) return;
  const byDate=new Map();
  for(const it of withDate){ if(!byDate.has(it.wd)) byDate.set(it.wd,[]); byDate.get(it.wd).push(it); }
  const yearsWithFilms=new Set(withDate.map(i=>i.wd.slice(0,4)));
  const firstDate=withDate[0].wd, lastDate=withDate[withDate.length-1].wd, firstYear=+firstDate.slice(0,4);
  const group=el("div","item-grid__group");
  const cells=el("div","item-grid__cells item-grid__cells--film-cal");
  cells.style.gridTemplateRows="auto repeat(4, var(--film-cell-height))";
  let col=1,row=1,lastMonthKey=null;
  const advance=()=>{row++; if(row>4){row=1;col++;}};
  const finishColumn=()=>{if(row>1){row=1;col++;}};
  const fromISO=iso=>{const[y,m,d]=iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d));};
  const toISO=dt=>dt.toISOString().slice(0,10);
  let cur=fromISO(lastDate); const stop=fromISO(firstDate);
  while(cur>=stop){
    const iso=toISO(cur), y=iso.slice(0,4);
    if(!yearsWithFilms.has(y)){
      finishColumn(); const endY=+y; let sy=endY;
      while(sy>=firstYear && !yearsWithFilms.has(String(sy))) sy--;
      const gap=el("div","item-grid__gap"); gap.style.gridColumn=col; gap.style.gridRow="2 / 6";
      const gl=el("span","item-grid__gap-label"); gl.textContent="no films logged";
      const gy=el("span","item-grid__gap-years"); gy.textContent=(sy+1===endY)?`${endY}`:`${sy+1}–${endY}`;
      gap.appendChild(gl); gap.appendChild(gy); cells.appendChild(gap);
      col++; cur=new Date(Date.UTC(sy,11,31)); lastMonthKey=null; continue;
    }
    const mk=iso.slice(0,7);
    if(mk!==lastMonthKey){ const ml=el("div","item-grid__month"); ml.textContent=`${MON[cur.getUTCMonth()]} ${y}`; ml.style.gridColumn=col; ml.style.gridRow=1; cells.appendChild(ml); lastMonthKey=mk; }
    const dom=cur.getUTCDate(); const df=byDate.get(iso);
    const place=cell=>{ if(col===1) cell.classList.add("item-grid__cell--first-col"); cell.style.gridColumn=col; cell.style.gridRow=row+1; cells.appendChild(cell); };
    if(df&&df.length){
      df.forEach((f,i)=>{ place(buildFilmCell(f,dom,i===0)); advance(); });
    } else {
      const cell=el("div","item-grid__cell item-grid__cell--day item-grid__cell--empty"); const num=el("span","item-grid__daynum"); num.textContent=dom; cell.appendChild(num); place(cell); advance();
    }
    cur.setUTCDate(cur.getUTCDate()-1);
  }
  group.appendChild(cells); gridEl.appendChild(group);
}

const grid=document.getElementById("grid");
buildFilmRibbon(grid, FILMS);
const wrap=document.getElementById("wrap");
requestAnimationFrame(()=>{ wrap.scrollLeft = 0; });
</script>
