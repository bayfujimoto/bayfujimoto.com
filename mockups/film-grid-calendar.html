<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consumption · Films · 2024 — calendar grid mockups</title>
<style>
  :root{
    --bg:#000; --vellum:#e8e0d0;
    --fg:var(--vellum);
    --muted:rgba(232,224,208,.5);
    --faint:rgba(232,224,208,.22);
    --line:rgba(232,224,208,.14);
    --line-dim:rgba(232,224,208,.08);
    --hover:rgba(232,224,208,.06);
    --mono:'Commit Mono',ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    --serif:'EB Garamond',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--serif)}
  body{padding:0 0 4rem}

  /* ── Masthead ───────────────────────────────────────────── */
  .mast{padding:1.4rem 1.6rem .9rem;border-bottom:1px solid var(--line)}
  .mast__kicker{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .mast__title{font-size:1.5rem;font-weight:400;margin:.25rem 0 .15rem;letter-spacing:.01em}
  .mast__sub{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;color:var(--muted)}
  .mast__sub b{color:var(--fg);font-weight:400}

  /* ── Control panel ──────────────────────────────────────── */
  .controls{position:sticky;top:0;z-index:30;background:rgba(0,0,0,.86);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:.7rem 1.6rem;display:flex;flex-wrap:wrap;gap:1.1rem 1.6rem;align-items:flex-end}
  .ctrl{display:flex;flex-direction:column;gap:.3rem}
  .ctrl__label{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
  .seg button{appearance:none;background:transparent;color:var(--muted);border:0;border-left:1px solid var(--line);
    font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;padding:.34rem .6rem;cursor:pointer;min-height:30px;white-space:nowrap}
  .seg button:first-child{border-left:0}
  .seg button:hover{background:var(--hover);color:var(--fg)}
  .seg button[aria-pressed="true"]{background:var(--vellum);color:#000}
  .controls__note{font-family:var(--mono);font-size:.62rem;color:var(--faint);letter-spacing:.04em;max-width:24ch;line-height:1.5}

  /* ── Stage / scroller ───────────────────────────────────── */
  .stagewrap{padding:1.4rem 1.6rem}
  .phone{margin:0 auto;border:1px solid var(--line);border-radius:26px;padding:10px;width:392px;max-width:100%;
    box-shadow:0 0 0 1px rgba(0,0,0,.6),0 24px 60px rgba(0,0,0,.6)}
  .phone__notch{width:120px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
  .stage{
    --u:82px;                 /* base cell height */
    --capH:0px;
    overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
    padding-bottom:.8rem;
  }
  .stage[data-size="s"]{--u:60px}
  .stage[data-size="m"]{--u:84px}
  .stage[data-size="l"]{--u:112px}
  .stage[data-title="below"]{--capH:22px}
  .stage[data-title="below"][data-date="show"]{--capH:38px}
  .phone .stage{--u:54px}
  .phone .stage[data-size="l"]{--u:66px}
  .stage::-webkit-scrollbar{height:9px}
  .stage::-webkit-scrollbar-track{background:var(--line-dim)}
  .stage::-webkit-scrollbar-thumb{background:var(--faint);border-radius:5px}

  /* ── Generic film cell ──────────────────────────────────── */
  .fc{position:relative;display:flex;flex-direction:column;scroll-snap-align:start}
  .fc__img{position:relative;width:100%;height:var(--u);background:#0c0c0c;overflow:hidden;border:1px solid var(--line-dim)}
  .fc__img img{width:100%;height:100%;object-fit:cover;display:block}
  .fc__noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:.55rem;color:var(--faint);letter-spacing:.06em;text-align:center;padding:.3rem}
  /* rewatch tick */
  .fc__re{position:absolute;top:4px;left:4px;font-family:var(--mono);font-size:.5rem;color:var(--vellum);
    background:rgba(0,0,0,.55);padding:0 3px;border-radius:1px;letter-spacing:.04em}
  /* caption below */
  .fc__cap{height:var(--capH);overflow:hidden;padding-top:3px;display:flex;flex-direction:column;justify-content:flex-start}
  .fc__title{font-family:var(--serif);font-size:.74rem;line-height:1.15;color:var(--fg);
    white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
  .fc__date{font-family:var(--mono);font-size:.58rem;letter-spacing:.04em;color:var(--muted);margin-top:1px}
  .stage[data-title="hidden"] .fc__cap{display:none}
  .stage[data-title="overlay"] .fc__cap{display:none}
  .stage[data-title="below"][data-date="hide"] .fc__date{display:none}
  .stage:not([data-date="show"]) .fc__date{display:none}
  /* overlay reveal */
  .fc__ov{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;pointer-events:none;
    background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.45) 55%,transparent);
    opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
  .fc__ov .fc__title{white-space:normal}
  .stage[data-title="overlay"] .fc__img:hover .fc__ov,
  .stage[data-title="overlay"] .fc:focus-within .fc__ov{opacity:1;transform:none}
  @media (hover:none){.stage[data-title="overlay"] .fc__ov{opacity:1;transform:none}}
  /* +N badge */
  .fc__badge{position:absolute;right:4px;bottom:4px;font-family:var(--mono);font-size:.56rem;
    background:rgba(0,0,0,.7);border:1px solid var(--line);color:var(--vellum);padding:0 4px;border-radius:2px;letter-spacing:.03em}
  /* stack (tiled thumbs in one cell) */
  .fc__stack{position:absolute;inset:0;display:grid;gap:1px}
  .fc__stack img{width:100%;height:100%;object-fit:cover}
  .fc__stack--2{grid-template-columns:1fr 1fr}
  .fc__stack--3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .fc__stack--3 img:first-child{grid-column:1/3}
  .fc__stack--4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .fc__stack--many{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
  .fc__stackmore{display:flex;align-items:center;justify-content:center;background:#111;
    font-family:var(--mono);font-size:.6rem;color:var(--muted)}

  /* ── Empty-day cell ─────────────────────────────────────── */
  .empty{display:flex;align-items:flex-start;justify-content:flex-end;
    border:1px solid transparent;font-family:var(--mono);font-size:.58rem;color:var(--faint);
    padding:3px 4px 0 0;user-select:none}
  .stage[data-empty="faint"] .empty{border-color:var(--line-dim);background:repeating-linear-gradient(135deg,transparent,transparent 6px,rgba(232,224,208,.025) 6px,rgba(232,224,208,.025) 7px)}
  .stage[data-empty="number"] .empty{color:var(--faint)}
  .stage[data-empty="blank"] .empty{color:transparent;border-color:transparent;background:none}

  /* ── Month label chips ──────────────────────────────────── */
  .mlabel{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

  /* ════ LAYOUT 1 · WEEK GRID ═════════════════════════════ */
  .week{display:grid;grid-auto-flow:column;grid-template-rows:auto repeat(7,calc(var(--u) + var(--capH)));
    grid-auto-columns:calc(var(--u)*16/9);gap:4px;align-items:start;width:max-content}
  .week .wk-month{grid-row:1;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap;padding-bottom:2px;align-self:end}
  .week .cell{width:calc(var(--u)*16/9)}
  .week .empty{height:var(--u);width:calc(var(--u)*16/9)}
  .week__dows{position:sticky;left:0;z-index:2}

  /* row of weekday initials at far left */
  .weekrow{display:grid;grid-template-rows:auto repeat(7,calc(var(--u) + var(--capH)));gap:4px;
    margin-right:8px;align-items:center;width:max-content}
  .weekrow span{grid-row:auto;font-family:var(--mono);font-size:.56rem;color:var(--muted);text-align:center}
  .week-shell{display:flex;align-items:start}

  /* ════ LAYOUT 2 · MONTH BLOCKS ══════════════════════════ */
  .months{display:flex;gap:1.6rem;width:max-content;align-items:start}
  .month{display:flex;flex-direction:column}
  .month__hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.45rem;gap:1rem}
  .month__name{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fg)}
  .month__count{font-family:var(--mono);font-size:.6rem;color:var(--muted)}
  .month__dows{display:grid;grid-template-columns:repeat(7,var(--mcw));gap:3px;margin-bottom:3px}
  .month__dows span{font-family:var(--mono);font-size:.5rem;color:var(--faint);text-align:right;padding-right:2px}
  .month__grid{--mcw:calc(var(--u)*16/9*.62);display:grid;grid-template-columns:repeat(7,var(--mcw));
    grid-auto-rows:calc(var(--u)*.62 + var(--capH));gap:3px}
  .month .fc__img{height:calc(var(--u)*.62)}
  .month .empty{height:calc(var(--u)*.62);width:var(--mcw)}
  .month .fc{width:var(--mcw)}
  .month__grid{--mcw:calc(var(--u)*16/9*.62)}

  /* ════ LAYOUT 3 · DAY STRIP ═════════════════════════════ */
  .strip{display:flex;align-items:start;gap:5px;width:max-content;height:auto}
  .strip .fc{height:auto}
  .strip .fc__img{height:calc(var(--u)*1.7)}
  .strip .cell{width:calc(var(--u)*1.7*16/9)}
  .strip .fc{width:calc(var(--u)*1.7*16/9)}
  .strip .empty{width:calc(var(--u)*.42);height:calc(var(--u)*1.7);writing-mode:vertical-rl;
    align-items:flex-end;justify-content:flex-start;padding:4px 0 0 0;text-orientation:mixed}
  .strip .strip-month{align-self:stretch;display:flex;align-items:flex-end;padding:0 2px 6px;
    border-left:1px solid var(--line);margin-left:3px}
  .strip .strip-month span{writing-mode:vertical-rl;font-family:var(--mono);font-size:.6rem;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  /* widen: multiple backdrops side by side in one day */
  .fc--wide .fc__img{display:flex}
  .fc--wide .fc__img img{width:auto;height:100%}

  /* ════ LAYOUT 4 · PACKED + GAPS ═════════════════════════ */
  .packed{display:grid;grid-template-rows:repeat(4,calc(var(--u)*.78 + var(--capH)));
    grid-auto-flow:column;gap:5px;width:max-content;align-items:start}
  .packed .fc__img{height:calc(var(--u)*.78)}
  .packed .cell,.packed .fc{width:calc(var(--u)*.78*16/9)}
  .gap{align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-left:1px dashed var(--line);border-right:1px dashed var(--line);
    font-family:var(--mono);font-size:.56rem;color:var(--faint);letter-spacing:.06em;text-align:center;
    padding:0 .4rem;white-space:nowrap}
  .gap b{color:var(--muted);font-weight:400;font-size:.7rem;display:block}

  .emptytag{font-family:var(--mono)}

  .legend{padding:.4rem 1.6rem 0;font-family:var(--mono);font-size:.62rem;color:var(--muted);letter-spacing:.03em}
  @media (max-width:600px){
    .controls{padding:.6rem .9rem;gap:.8rem 1rem}
    .mast{padding:1rem .9rem .7rem}
    .stagewrap{padding:1rem .6rem}
  }
</style>
</head>

  <header class="mast">
    <div class="mast__kicker">Consumption · Films · Calendar grid — design mockups</div>
    <h1 class="mast__title">A year of watching, 2024</h1>
    <div class="mast__sub"><b>201</b> films · <b>160</b> of 366 days · backdrops from the live archive · real watch dates</div>
  </header>

  <section class="controls" id="controls">
    <div class="ctrl">
      <span class="ctrl__label">Layout</span>
      <div class="seg" data-opt="layout">
        <button data-val="week" aria-pressed="true">Week grid</button>
        <button data-val="months">Month blocks</button>
        <button data-val="strip">Day strip</button>
        <button data-val="packed">Packed + gaps</button>
      </div>
    </div>
    <div class="ctrl">
      <span class="ctrl__label">View</span>
      <div class="seg" data-opt="view">
        <button data-val="desktop" aria-pressed="true">Desktop</button>
        <button data-val="mobile">Mobile</button>
      </div>
    </div>
    <div class="ctrl">
      <span class="ctrl__label">Title</span>
      <div class="seg" data-opt="title">
        <button data-val="below" aria-pressed="true">Below</button>
        <button data-val="overlay">Overlay</button>
        <button data-val="hidden">Hidden</button>
      </div>
    </div>
    <div class="ctrl">
      <span class="ctrl__label">Date</span>
      <div class="seg" data-opt="date">
        <button data-val="show" aria-pressed="true">Show</button>
        <button data-val="hide">Hide</button>
      </div>
    </div>
    <div class="ctrl">
      <span class="ctrl__label">Empty days</span>
      <div class="seg" data-opt="empty">
        <button data-val="number" aria-pressed="true">Number</button>
        <button data-val="faint">Faint</button>
        <button data-val="blank">Blank</button>
      </div>
    </div>
    <div class="ctrl">
      <span class="ctrl__label">Multi-film day</span>
      <div class="seg" data-opt="multi">
        <button data-val="stack" aria-pressed="true">Stack</button>
        <button data-val="widen">Widen</button>
        <button data-val="badge">+N badge</button>
      </div>
    </div>
    <div class="ctrl">
      <span class="ctrl__label">Cell size</span>
      <div class="seg" data-opt="size">
        <button data-val="s">S</button>
        <button data-val="m" aria-pressed="true">M</button>
        <button data-val="l">L</button>
      </div>
    </div>
    <div class="controls__note" id="note"></div>
  </section>

  <div class="legend" id="legend"></div>
  <div class="stagewrap" id="stagewrap"></div>

};

// ── Cell builders ───────────────────────────────────────────
function fmtDate(iso){ const [y,m,d]=iso.split("-"); return MON[+m-1]+" "+(+d); }

function imgEl(film){
  if (film.backdrop){
    const i = document.createElement("img");
    i.src = film.backdrop; i.alt=""; i.loading="lazy"; i.decoding="async";
    return i;
  }
  const n = document.createElement("span");
  n.className="fc__noimg"; n.textContent="no reproduction";
  return n;
}

function caption(title, iso){
  const cap = document.createElement("div"); cap.className="fc__cap";
  const t = document.createElement("div"); t.className="fc__title"; t.textContent=title; cap.appendChild(t);
  const d = document.createElement("div"); d.className="fc__date"; d.textContent=fmtDate(iso); cap.appendChild(d);
  return cap;
}

// single film cell
function singleCell(film, iso){
  const fc = document.createElement("div"); fc.className="fc cell"; fc.tabIndex=0;
  fc.title = film.title + " ("+film.year+")";
  const img = document.createElement("div"); img.className="fc__img";
  img.appendChild(imgEl(film));
  if (film.rewatch){ const r=document.createElement("span"); r.className="fc__re"; r.textContent="re"; img.appendChild(r); }
  // overlay reveal
  const ov = document.createElement("div"); ov.className="fc__ov";
  ov.appendChild(caption(film.title, iso));
  img.appendChild(ov);
  fc.appendChild(img);
  fc.appendChild(caption(film.title, iso));
  return fc;
}

// stacked multi-film cell (one slot, tiled)
function stackCell(films, iso){
  const fc = document.createElement("div"); fc.className="fc cell"; fc.tabIndex=0;
  fc.title = films.length+" films on "+fmtDate(iso);
  const img = document.createElement("div"); img.className="fc__img";
  const stack = document.createElement("div");
  const n = films.length;
  stack.className = "fc__stack "+(n===2?"fc__stack--2":n===3?"fc__stack--3":n===4?"fc__stack--4":"fc__stack--many");
  const show = films.slice(0, n>6?5:Math.min(n,6));
  show.forEach(f=> stack.appendChild(imgEl(f)));
  if (n>6){ const more=document.createElement("div"); more.className="fc__stackmore"; more.textContent="+"+(n-5); stack.appendChild(more); }
  img.appendChild(stack);
  const ov = document.createElement("div"); ov.className="fc__ov";
  ov.appendChild(caption(n+" films", iso));
  img.appendChild(ov);
  fc.appendChild(img);
  fc.appendChild(caption(films.map(f=>f.title).join(" · "), iso));
  return fc;
}

// +N badge cell
function badgeCell(films, iso){
  const fc = singleCell(films[0], iso);
  if (films.length>1){ const b=document.createElement("span"); b.className="fc__badge"; b.textContent="+"+(films.length-1); fc.querySelector(".fc__img").appendChild(b); }
  const t = fc.querySelector(".fc__cap .fc__title"); if(t) t.textContent = films[0].title + (films.length>1?"  +"+(films.length-1):"");
  return fc;
}

// widen cell: multiple backdrops side by side in one slot
function wideCell(films, iso){
  const fc = document.createElement("div"); fc.className="fc cell fc--wide"; fc.tabIndex=0;
  fc.style.width = "calc(var(--u)*1.7*16/9 * "+films.length+")";
  fc.title = films.length+" films on "+fmtDate(iso);
  const img = document.createElement("div"); img.className="fc__img";
  films.forEach(f=> img.appendChild(imgEl(f)));
  fc.appendChild(img);
  fc.appendChild(caption(films.map(f=>f.title).join(" · "), iso));
  return fc;
}

// Build the cell(s) for a day according to multi mode + layout.
// Returns array of elements (length 1 except packed+widen).
function dayCells(day, layout){
  const f = day.films;
  if (f.length===1) return [singleCell(f[0], day.date)];
  // multi-film
  if (opts.multi==="badge") return [badgeCell(f, day.date)];
  if (opts.multi==="widen"){
    if (layout==="strip") return [wideCell(f, day.date)];
    if (layout==="packed") return f.map(x=> singleCell(x, day.date)); // adjacent
    return [stackCell(f, day.date)]; // week/month fixed grid → fall back to stack
  }
  return [stackCell(f, day.date)]; // stack (default)
}

function emptyCell(day){
  const e = document.createElement("div"); e.className="empty";
  e.textContent = opts.empty==="blank" ? "" : day.dom;
  return e;
}

// ── Layout renderers ────────────────────────────────────────
function renderWeek(stage){
  const shell = document.createElement("div"); shell.className="week-shell";
  // weekday rail
  const rail = document.createElement("div"); rail.className="weekrow week__dows";
  const spacer=document.createElement("span"); rail.appendChild(spacer); // align with month row
  DOW_MON.forEach(d=>{ const s=document.createElement("span"); s.textContent=d; rail.appendChild(s); });
  shell.appendChild(rail);

  const grid = document.createElement("div"); grid.className="week";
  // leading blanks so day 1 sits on its weekday row
  const lead = days[0].dowMon;
  for (let i=0;i<lead;i++){ const ph=document.createElement("div"); ph.style.gridRow=(i+2); ph.style.gridColumn=1; grid.appendChild(ph); }
  let lastMonth=-1;
  days.forEach((day,idx)=>{
    const pos = lead + idx;
    const col = Math.floor(pos/7)+1;
    const row = (pos%7)+2; // +2: row1 is month labels
    // month label at the top of the column where a new month starts
    if (day.month!==lastMonth){
      const ml=document.createElement("div"); ml.className="wk-month"; ml.textContent=MON[day.month];
      ml.style.gridColumn=col; ml.style.gridRow=1; grid.appendChild(ml); lastMonth=day.month;
    }
    let nodes;
    if (day.films.length===0){ nodes=[emptyCell(day)]; }
    else { nodes = dayCells(day,"week"); }
    nodes.forEach(n=>{ n.style.gridColumn=col; n.style.gridRow=row; grid.appendChild(n); });
  });
  shell.appendChild(grid);
  stage.appendChild(shell);
}

function renderMonths(stage){
  const wrap=document.createElement("div"); wrap.className="months";
  for (let m=0;m<12;m++){
    const md = days.filter(d=>d.month===m);
    const count = md.reduce((s,d)=>s+d.films.length,0);
    const block=document.createElement("div"); block.className="month";
    const hd=document.createElement("div"); hd.className="month__hd";
    const nm=document.createElement("div"); nm.className="month__name"; nm.textContent=MON[m];
    const ct=document.createElement("div"); ct.className="month__count"; ct.textContent=count+" films";
    hd.appendChild(nm); hd.appendChild(ct); block.appendChild(hd);
    const dows=document.createElement("div"); dows.className="month__dows";
    DOW_MON.forEach(d=>{ const s=document.createElement("span"); s.textContent=d; dows.appendChild(s); });
    block.appendChild(dows);
    const grid=document.createElement("div"); grid.className="month__grid";
    const lead=md[0].dowMon;
    for(let i=0;i<lead;i++){ const ph=document.createElement("div"); grid.appendChild(ph); }
    md.forEach(day=>{
      if (day.films.length===0) grid.appendChild(emptyCell(day));
      else dayCells(day,"months").forEach(n=>grid.appendChild(n));
    });
    block.appendChild(grid);
    wrap.appendChild(block);
  }
  stage.appendChild(wrap);
}

function renderStrip(stage){
  const row=document.createElement("div"); row.className="strip";
  let lastMonth=-1;
  days.forEach(day=>{
    if (day.month!==lastMonth){
      const mm=document.createElement("div"); mm.className="strip-month";
      const s=document.createElement("span"); s.textContent=MON[day.month]; mm.appendChild(s);
      row.appendChild(mm); lastMonth=day.month;
    }
    if (day.films.length===0) row.appendChild(emptyCell(day));
    else dayCells(day,"strip").forEach(n=>row.appendChild(n));
  });
  stage.appendChild(row);
}

function renderPacked(stage){
  const grid=document.createElement("div"); grid.className="packed";
  let col=1, rowi=1, lastDate=null;
  const place=(node)=>{ node.style.gridColumn=col; node.style.gridRow=rowi; grid.appendChild(node);
    rowi++; if(rowi>4){rowi=1;col++;} };
  const watched = days.filter(d=>d.films.length>0);
  watched.forEach(day=>{
    if (lastDate){
      const gapDays = Math.round((Date.parse(day.date)-Date.parse(lastDate))/86400000) - 1;
      if (gapDays>0){
        if (rowi>1){ rowi=1; col++; }          // finish current column
        const g=document.createElement("div"); g.className="gap";
        g.innerHTML="<b>"+gapDays+"</b>"+(gapDays===1?"day":"days");
        g.style.gridColumn=col; g.style.gridRow="1 / 5";
        // width proportional to gap (clamped)
        g.style.minWidth=Math.min(10+gapDays*3,80)+"px";
        grid.appendChild(g); col++; rowi=1;
      }
    }
    dayCells(day,"packed").forEach(n=>place(n));
    lastDate=day.date;
  });
  stage.appendChild(grid);
}

// ── Render dispatch ─────────────────────────────────────────
const wrapEl = document.getElementById("stagewrap");
function render(){
  document.getElementById("note").textContent = NOTES[opts.layout];
  const watched = days.filter(d=>d.films.length>0).length;
  document.getElementById("legend").textContent =
    "201 films · "+watched+" days watched · "+(366-watched)+" empty days · 2024";

  wrapEl.innerHTML="";
  const stage=document.createElement("div"); stage.className="stage";
  stage.dataset.size=opts.size; stage.dataset.title=opts.title; stage.dataset.date=opts.date;
  stage.dataset.empty=opts.empty; stage.dataset.multi=opts.multi;

  if (opts.layout==="week") renderWeek(stage);
  else if (opts.layout==="months") renderMonths(stage);
  else if (opts.layout==="strip") renderStrip(stage);
  else renderPacked(stage);

  if (opts.view==="mobile"){
    const phone=document.createElement("div"); phone.className="phone";
    const notch=document.createElement("div"); notch.className="phone__notch"; phone.appendChild(notch);
    phone.appendChild(stage);
    wrapEl.appendChild(phone);
  } else {
    wrapEl.appendChild(stage);
  }
}

// ── Controls wiring ─────────────────────────────────────────
document.getElementById("controls").addEventListener("click", e=>{
  const btn=e.target.closest("button[data-val]"); if(!btn) return;
  const group=btn.closest(".seg"); const opt=group.dataset.opt;
  group.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===btn?"true":"false"));
  opts[opt]=btn.dataset.val;
  render();
});

render();
</script>
