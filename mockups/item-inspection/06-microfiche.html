<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup 06 — Microfiche frame</title>
<link rel="stylesheet" href="shared.css">
<style>
/* ── Microfiche: the item sits inside a film cell — sprocketed edges, frame
   number, edge codes. Adjacent cells hint at the series as ghost frames. */

.fiche {
  display: flex;
  align-items: stretch;
  gap: 0;
  width: min(1100px, 96vw);
  overflow: hidden;
}

.cell {
  position: relative;
  flex: 0 0 auto;
  border: 1px solid var(--border-dim);
  background: rgba(232, 224, 208, 0.025);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3.5rem 2.5rem;
}
.cell--current {
  flex: 1 1 auto;
  border-color: var(--border);
  min-height: min(480px, 62vh);
}
.cell--ghost {
  flex: 0 0 130px;
  opacity: 0.35;
  filter: blur(0.6px);
  cursor: pointer;
  transition: opacity var(--dur-base) var(--ease-out);
}
.cell--ghost:hover { opacity: 0.6; }
.cell--ghost svg { width: 80%; max-height: 90px; }

.cell--current .img { width: min(420px, 80%); }
.cell--current .img svg { width: 100%; height: auto; }

/* Sprocket holes top and bottom */
.sprockets {
  position: absolute;
  left: 0; right: 0;
  height: 1.6rem;
  display: flex;
  justify-content: space-evenly;
  align-items: center;
}
.sprockets.top { top: 0.5rem; }
.sprockets.bot { bottom: 0.5rem; }
.sprockets span {
  width: 9px; height: 12px;
  border: 1px solid var(--overlay-faint);
  border-radius: 1.5px;
}

/* Edge codes — film metadata burned into the margins */
.edge-code {
  position: absolute;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-wider);
  color: var(--overlay-muted);
  text-transform: uppercase;
  white-space: nowrap;
}
.edge-code.tl { top: 2.4rem; left: 1.25rem; }
.edge-code.tr { top: 2.4rem; right: 1.25rem; }
.edge-code.bl { bottom: 2.4rem; left: 1.25rem; }
.edge-code.br { bottom: 2.4rem; right: 1.25rem; color: var(--overlay-text); }

/* Reader line: faint horizontal scan line across the current cell */
.cell--current::after {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 48%;
  height: 1px;
  background: linear-gradient(90deg, transparent,
    rgba(232,224,208,0.10) 20%, rgba(232,224,208,0.10) 80%, transparent);
  pointer-events: none;
}

.fiche-caption {
  margin-top: 1.5rem;
  text-align: center;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-wider);
  color: var(--overlay-muted);
}

@media (max-width: 600px) {
  .cell--ghost { display: none; }
  .cell--current { padding: 3rem 1rem; }
  .edge-code.tl, .edge-code.bl { left: 0.75rem; }
  .edge-code.tr, .edge-code.br { right: 0.75rem; }
}
</style>
</head>
<body>

<div class="mock-banner">
  <span>06 / microfiche — experimental</span>
  <a href="index.html">index ↩</a>
</div>

<main class="stage">
  <div>
    <div class="fiche" aria-label="Microfiche strip, frame 003 of accumulation series">
      <div class="cell cell--ghost" id="prev" title="EPH-2026-002">
        <div class="sprockets top"><span></span><span></span><span></span></div>
        <div class="sprockets bot"><span></span><span></span><span></span></div>
      </div>

      <div class="cell cell--current">
        <div class="sprockets top">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="sprockets bot">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <span class="edge-code tl">acc · ephemera</span>
        <span class="edge-code tr">frame 003</span>
        <span class="edge-code bl">paris · 2024-08-25</span>
        <span class="edge-code br">130 × 54 mm</span>
        <div class="img" id="img"></div>
      </div>

      <div class="cell cell--ghost" id="next" title="EPH-2026-004">
        <div class="sprockets top"><span></span><span></span><span></span></div>
        <div class="sprockets bot"><span></span><span></span><span></span></div>
      </div>
    </div>
    <div class="fiche-caption">EPH-2026-003 · Eiffel Tower Ticket · source: Eiffel Tower</div>
  </div>
</main>

<nav class="layer-breadcrumb">
  <span>desk</span><span class="sep">/</span>
  <span>accumulation</span><span class="sep">/</span>
  <span class="current">eiffel tower ticket</span>
</nav>

<script src="items.js"></script>
<script>
  document.getElementById('img').innerHTML = window.ITEMS.ticket.svg;
  document.getElementById('prev').innerHTML += window.ITEMS.lp.svg;
  document.getElementById('next').innerHTML += window.ITEMS.poster.svg;
</script>
</body>
</html>
