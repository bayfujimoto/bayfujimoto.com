[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Admin route — serves admin.html, hash router handles sub-routes
[[redirects]]
  from = "/admin/*"
  to   = "/admin.html"
  status = 200

# SPA catch-all — all routes serve index.html, JS router handles them
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
