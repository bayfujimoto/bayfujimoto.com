[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# API routes — served by Netlify Functions
[[redirects]]
  from = "/api/save-record"
  to   = "/.netlify/functions/save-record"
  status = 200

[[redirects]]
  from = "/api/commit-all"
  to   = "/.netlify/functions/commit-all"
  status = 200

# Admin route — serves admin.html, hash router handles sub-routes
[[redirects]]
  from = "/admin/*"
  to   = "/admin.html"
  status = 200

# SPA catch-all — all routes serve index.html, JS router handles them
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
